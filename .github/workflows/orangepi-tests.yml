# Tests for the Orange Pi port: platform module, controllers, flame-out
# detector, MQTT remote control and closed-loop scenarios on the grill
# simulator.  The simulator comparison is attached to every run as an artifact.
name: Orange Pi tests

on:
  push:
    branches: ["orangepi-dev", "orangepi-stable"]
  pull_request:
    branches: ["orangepi-dev", "orangepi-stable"]
  workflow_call:
  workflow_dispatch:
  schedule:
    # Monday morning: catches vulnerabilities published for libraries we already use
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11: Debian 12 / Orange Pi OS, 3.13: Debian 13 (Armbian trixie)
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Check shell scripts
        run: |
          bash -n auto-install/install.sh
          bash -n auto-install/orangepi/setup.sh

      - name: Run tests
        run: python -m pytest tests -q

      - name: Simulator comparison
        if: matrix.python-version == '3.13'
        run: |
          mkdir -p sim-report
          python -m tools.grill_sim --compare pid pid_ac pid_sp pid_clamping --plot sim-report/controllers.png | tee sim-report/controllers.txt
          python -m tools.grill_sim --scenario flameout --no-flameout-detect | tee sim-report/flameout-without-detector.txt
          python -m tools.grill_sim --compare pid pid_ac pid_sp pid_clamping --json > sim-report/controllers.json

      - name: Upload simulator report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: simulator-report
          path: sim-report/

  audit:
    # Installs the grill's Python dependencies (auto-install/requirements.txt plus
    # the packages the installer adds) and checks them against known vulnerabilities.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build dependencies (bluepy)
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev

      - name: Install the grill's Python packages
        run: |
          python -m venv /tmp/pifire
          /tmp/pifire/bin/pip install --upgrade pip
          /tmp/pifire/bin/pip install -r auto-install/requirements.txt eventlet "influxdb_client[ciso]==1.48.0" scikit-learn==1.7.2 "gpiod>=2.2,<3"

      - name: Known vulnerabilities (pip-audit)
        run: |
          /tmp/pifire/bin/pip install pip-audit
          /tmp/pifire/bin/pip-audit --progress-spinner off --desc
